# Slide 77 - A Gateway and a weighted HTTPRoute  (REFERENCE / optional)
# Needs the Gateway API CRDs + a controller such as Envoy Gateway (GatewayClass "envoy"),
# plus namespaces infra and shop and Services api-v1 / api-v2 in shop.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: shop-gw, namespace: infra }
spec:
  gatewayClassName: envoy
  listeners:
    - { name: http, protocol: HTTP, port: 80,
        allowedRoutes: { namespaces: { from: All } } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: shop-route, namespace: shop }
spec:
  parentRefs: [{ name: shop-gw, namespace: infra }]
  hostnames: [shop.example.com]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs:
        - { name: api-v1, port: 80, weight: 90 }
        - { name: api-v2, port: 80, weight: 10 }   # 10% canary
