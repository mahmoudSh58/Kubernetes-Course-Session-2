# Slide 31 - A Pod that reads mysql-secret as environment variables
apiVersion: v1
kind: Pod
metadata: { name: secret-reader, namespace: webapp-stack }
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo DB_USER=$DB_USER; echo DB_PASSWORD=$DB_PASSWORD; sleep 3600"]
      envFrom: [{ secretRef: { name: mysql-secret } }]
