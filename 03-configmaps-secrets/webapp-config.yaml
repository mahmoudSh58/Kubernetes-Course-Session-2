# Slide 29 - A ConfigMap used as env vars AND as a file
apiVersion: v1
kind: ConfigMap
metadata: { name: webapp-config, namespace: webapp-stack }
data:
  LOG_LEVEL: "info"
  default.conf: |
    server {
      listen 8081;
      location / { root /usr/share/nginx/html; }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-config
  namespace: webapp-stack
  labels: { app: nginx-config }
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      envFrom: [{ configMapRef: { name: webapp-config } }]
      volumeMounts:
        - { name: conf, mountPath: /etc/nginx/conf.d }
  volumes:
    - name: conf
      configMap:
        name: webapp-config
        items: [{ key: default.conf, path: default.conf }]
