# Slide 30/31 - Declarative version of mysql-secret.
# stringData = plain text you write; the API server stores it base64-encoded.
# DEMO ONLY - never commit real Secrets to Git (use Sealed Secrets / External Secrets).
apiVersion: v1
kind: Secret
metadata: { name: mysql-secret, namespace: webapp-stack }
type: Opaque
stringData:
  DB_USER: app
  DB_PASSWORD: "S3cret!"
