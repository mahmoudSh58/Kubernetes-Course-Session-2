# Slide 39 - Labels are how objects find each other
# Six Pods with the labels from the slide, in their own namespace "label-demo".
# Selector app=webapp-api,env=prod  ->  pod-1 and pod-4
apiVersion: v1
kind: Namespace
metadata: { name: label-demo }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-1, namespace: label-demo, labels: { app: webapp-api, env: prod } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-2, namespace: label-demo, labels: { app: webapp-api, env: dev } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-3, namespace: label-demo, labels: { app: mysql, env: prod } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-4, namespace: label-demo, labels: { app: webapp-api, env: prod } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-5, namespace: label-demo, labels: { app: cache } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
---
apiVersion: v1
kind: Pod
metadata: { name: pod-6, namespace: label-demo, labels: { app: mysql, env: dev } }
spec: { containers: [{ name: c, image: busybox:1.36, command: ["sleep", "3600"] }] }
