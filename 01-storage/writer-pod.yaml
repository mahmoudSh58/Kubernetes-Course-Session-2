# Slide 14 - Prove the data survives the Pod
# Same writer Pod as slide 10, but the volume is now the claim data-pvc.
apiVersion: v1
kind: Pod
metadata: { name: writer, namespace: webapp-stack }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: data-pvc }
