# Slide 21 - A Job that runs to completion
# Runs once for the whole app (unlike an init container that runs once per Pod).
apiVersion: batch/v1
kind: Job
metadata: { name: seed-content, namespace: webapp-stack }
spec:
  completions: 1          # how many successful runs
  backoffLimit: 3         # retries before marking Failed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c", "echo '<h1>Seeded</h1>' > /data/index.html"]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data-pvc }
