# Chapter 4 helper - two Pods to show Pod-to-Pod traffic without NAT.
# Both listen on port 80 - no port juggling, every Pod has its own IP.
apiVersion: v1
kind: Pod
metadata: { name: pod-a, namespace: webapp-stack, labels: { demo: net } }
spec:
  containers:
    - name: web
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata: { name: pod-b, namespace: webapp-stack, labels: { demo: net } }
spec:
  containers:
    - name: web
      image: nginx:1.27
