# Claim for the MySQL data directory.
# Demo uses the minikube default StorageClass "standard" (dynamic provisioning).
# (In Task 2 you write a static hostPath PV "mysql-pv" yourself, like data-pv in 01-storage.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mysql-pvc, namespace: webapp-stack }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: { requests: { storage: 1Gi } }
