# Running example (slide 5): webapp-config now also carries DB_HOST=mysql-svc.
# The app finds the database by its Service NAME (DNS) - never a Pod IP.
apiVersion: v1
kind: ConfigMap
metadata: { name: webapp-config, namespace: webapp-stack }
data:
  LOG_LEVEL: "info"
  DB_HOST: "mysql-svc"
  DB_PORT: "3306"
  default.conf: |
    server {
      listen 8081;
      location / { root /usr/share/nginx/html; }
    }
