# Slide 57 - mysql-svc: selector must match the Pod template labels,
# targetPort must be the port MySQL listens on (3306).
apiVersion: v1
kind: Service
metadata: { name: mysql-svc, namespace: webapp-stack }
spec:
  type: ClusterIP
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
