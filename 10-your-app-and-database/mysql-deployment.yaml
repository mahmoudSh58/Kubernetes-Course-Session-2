# Slide 60 - The database Deployment
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: webapp-stack }
spec:
  replicas: 1
  strategy: { type: Recreate }       # never two writers on one RWO volume
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: DB_PASSWORD } }
          ports: [{ containerPort: 3306 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-pvc }
