# Slide 59 - generated with:
#   kubectl create deployment webapp-api --image=webapp-api:v1 --dry-run=client -o yaml > webapp-api.yaml
# then: imagePullPolicy: IfNotPresent (use the copy loaded by "minikube image load"),
#       namespace, 2 replicas, port 8081 and settings from webapp-config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-api
  namespace: webapp-stack
  labels: { app: webapp-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: webapp-api }
  template:
    metadata:
      labels: { app: webapp-api, env: prod }
    spec:
      containers:
        - name: webapp-api
          image: webapp-api:v1              # fixed tag - never :latest
          imagePullPolicy: IfNotPresent     # use the image loaded into minikube
          ports: [{ name: http, containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: webapp-config } }]
